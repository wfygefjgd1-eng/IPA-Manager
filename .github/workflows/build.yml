name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_15.2.app 2>/dev/null \
            || sudo xcode-select --switch /Applications/Xcode_15.1.app 2>/dev/null \
            || { echo "Required Xcode not found"; exit 1; }

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache OpenSSL build
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: |
            Vendor/openssl/lib
            Vendor/openssl/include
          key: openssl-ios-${{ runner.os }}-${{ hashFiles('scripts/build-openssl.sh') }}-v1

      - name: Build OpenSSL for iOS (device arm64)
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: bash scripts/build-openssl.sh

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build unsigned device IPA
        run: |
          MARKETING_VERSION="1.0.${{ github.run_number }}"
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Building v${MARKETING_VERSION} (${BUILD_NUMBER})"
          xcodebuild -project "IPA Manager.xcodeproj" \
            -scheme "IPA Manager" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            build
          mkdir -p build/artifacts
          ditto -c -k --keepParent "build/device/Build/Products/Release-iphoneos/IPA Manager.app" "build/artifacts/IPA-Manager-v${MARKETING_VERSION}-unsigned.ipa"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IPA-Manager-Build
          path: |
            build/artifacts
          if-no-files-found: warn