name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_15.2.app || sudo xcode-select --switch /Applications/Xcode_15.1.app || echo "Using default Xcode"

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build OpenSSL for iOS
        run: |
          curl -L -o /tmp/openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.3.2/openssl-3.3.2.tar.gz
          cd /tmp
          tar -xzf openssl.tar.gz
          cd openssl-3.3.2

          XCODE_DEV=$(xcode-select -p | sed 's|/Contents/Developer||')
          IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SIM_SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          IOS_SDK_NAME=$(basename "$IOS_SDK_PATH")
          SIM_SDK_NAME=$(basename "$SIM_SDK_PATH")
          echo "iOS SDK: $IOS_SDK_PATH"
          echo "Sim SDK: $SIM_SDK_PATH"

          export IOS_CROSS_TOP="$XCODE_DEV/Contents/Developer/Platforms/iPhoneOS.platform"
          export SIM_CROSS_TOP="$XCODE_DEV/Contents/Developer/Platforms/iPhoneSimulator.platform"

          # Build for device (arm64)
          export CROSS_TOP="$IOS_CROSS_TOP" CROSS_SDK="$IOS_SDK_NAME"
          CC="xcrun --sdk iphoneos clang" ./Configure ios64-cross \
            --prefix=/tmp/openssl-out/device \
            --openssldir=/tmp/openssl-out/device \
            -D__IPHONE_OS_VERSION_MIN_REQUIRED=160000 \
            no-shared no-tests no-unit-test
          make -j4 build_libs || make build_libs
          make install_dev

          # Build for simulator (arm64)
          make distclean 2>/dev/null || true
          export CROSS_TOP="$SIM_CROSS_TOP" CROSS_SDK="$SIM_SDK_NAME"
          CC="xcrun --sdk iphonesimulator clang" ./Configure ios-sim-cross-arm64 \
            --prefix=/tmp/openssl-out/sim-arm64 \
            --openssldir=/tmp/openssl-out/sim-arm64 \
            -D__IPHONE_OS_VERSION_MIN_REQUIRED=160000 \
            no-shared no-tests no-unit-test
          make -j4 build_libs || make build_libs
          make install_dev

          # Build for simulator (x86_64)
          make distclean 2>/dev/null || true
          export CROSS_TOP="$SIM_CROSS_TOP" CROSS_SDK="$SIM_SDK_NAME"
          CC="xcrun --sdk iphonesimulator clang" ./Configure ios-sim-cross-x86_64 \
            --prefix=/tmp/openssl-out/sim-x86_64 \
            --openssldir=/tmp/openssl-out/sim-x86_64 \
            -D__IPHONE_OS_VERSION_MIN_REQUIRED=160000 \
            no-shared no-tests no-unit-test
          make -j4 build_libs || make build_libs
          make install_dev

          # Combine into xcframework
          mkdir -p "$GITHUB_WORKSPACE/Vendor/openssl/include"
          cp -R /tmp/openssl-out/device/include/openssl "$GITHUB_WORKSPACE/Vendor/openssl/include/openssl"

          libtool -static -o /tmp/openssl-out/libcrypto-device.a /tmp/openssl-out/device/lib/libcrypto.a /tmp/openssl-out/device/lib/libssl.a
          libtool -static -o /tmp/openssl-out/libcrypto-sim-arm64.a /tmp/openssl-out/sim-arm64/lib/libcrypto.a /tmp/openssl-out/sim-arm64/lib/libssl.a
          libtool -static -o /tmp/openssl-out/libcrypto-sim-x86_64.a /tmp/openssl-out/sim-x86_64/lib/libcrypto.a /tmp/openssl-out/sim-x86_64/lib/libssl.a
          libtool -static -o /tmp/openssl-out/libcrypto-sim.a /tmp/openssl-out/libcrypto-sim-arm64.a /tmp/openssl-out/libcrypto-sim-x86_64.a

          xcodebuild -create-xcframework \
            -library /tmp/openssl-out/libcrypto-device.a -headers "$GITHUB_WORKSPACE/Vendor/openssl/include" \
            -library /tmp/openssl-out/libcrypto-sim.a -headers "$GITHUB_WORKSPACE/Vendor/openssl/include" \
            -output "$GITHUB_WORKSPACE/Vendor/openssl/openssl.xcframework"

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build (unsigned simulator build for verification)
        run: |
          xcodebuild -project "IPA Manager.xcodeproj" \
            -scheme "IPA Manager" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned device IPA
        run: |
          xcodebuild -project "IPA Manager.xcodeproj" \
            -scheme "IPA Manager" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p build/artifacts
          ditto -c -k --keepParent "build/device/Build/Products/Release-iphoneos/IPA Manager.app" "build/artifacts/IPA-Manager-unsigned.ipa"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IPA-Manager-Build
          path: |
            build/artifacts
          if-no-files-found: warn
