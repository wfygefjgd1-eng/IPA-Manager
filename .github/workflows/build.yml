name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_15.2.app || sudo xcode-select --switch /Applications/Xcode_15.1.app || echo "Using default Xcode"

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build OpenSSL for iOS
        run: |
          mkdir -p /tmp/ossl_src
          curl -L -o /tmp/ossl_src/openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.3.2/openssl-3.3.2.tar.gz
          cd /tmp/ossl_src
          tar -xzf openssl.tar.gz
          cd openssl-3.3.2

          # Use workspace-relative output dir to avoid /private/tmp symlink issues
          OUTDIR="$GITHUB_WORKSPACE/build/openssl-out"
          mkdir -p "$OUTDIR"

          # Build for device (arm64) - ios64-xcrun auto-detects SDK via xcrun
          ./Configure ios64-xcrun \
            --prefix="$OUTDIR/device" \
            --openssldir="$OUTDIR/device" \
            -D__IPHONE_OS_VERSION_MIN_REQUIRED=160000 \
            no-shared no-tests no-unit-test no-apps
          make -j4 build_libs || make build_libs
          make install_dev

          # Build for simulator (arm64) - use xcrun auto sdk
          make distclean 2>/dev/null || true
          ./Configure iossimulator-arm64-xcrun \
            --prefix="$OUTDIR/sim-arm64" \
            --openssldir="$OUTDIR/sim-arm64" \
            -D__IPHONE_OS_VERSION_MIN_REQUIRED=160000 \
            no-shared no-tests no-unit-test no-apps
          make -j4 build_libs || make build_libs
          make install_dev

          # Combine into xcframework (device arm64 + simulator arm64)
          mkdir -p "$GITHUB_WORKSPACE/Vendor/openssl/include"
          cp -R "$OUTDIR/device/include/openssl" "$GITHUB_WORKSPACE/Vendor/openssl/include/openssl"

          xcodebuild -create-xcframework \
            -library "$OUTDIR/device/lib/libcrypto.a" -headers "$GITHUB_WORKSPACE/Vendor/openssl/include" \
            -library "$OUTDIR/device/lib/libssl.a" \
            -library "$OUTDIR/sim-arm64/lib/libcrypto.a" -headers "$GITHUB_WORKSPACE/Vendor/openssl/include" \
            -library "$OUTDIR/sim-arm64/lib/libssl.a" \
            -output "$GITHUB_WORKSPACE/Vendor/openssl/openssl.xcframework"

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build (unsigned simulator build for verification)
        run: |
          xcodebuild -project "IPA Manager.xcodeproj" \
            -scheme "IPA Manager" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned device IPA
        run: |
          xcodebuild -project "IPA Manager.xcodeproj" \
            -scheme "IPA Manager" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p build/artifacts
          ditto -c -k --keepParent "build/device/Build/Products/Release-iphoneos/IPA Manager.app" "build/artifacts/IPA-Manager-unsigned.ipa"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IPA-Manager-Build
          path: |
            build/artifacts
          if-no-files-found: warn
