name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_15.2.app 2>/dev/null \
            || sudo xcode-select --switch /Applications/Xcode_15.1.app 2>/dev/null \
            || { echo "Required Xcode not found"; exit 1; }

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore OpenSSL cache
        id: cache-openssl
        uses: actions/cache/restore@v4
        with:
          path: |
            Vendor/openssl/lib
            Vendor/openssl/include
          key: openssl-ios-${{ runner.os }}-${{ hashFiles('scripts/build-openssl.sh') }}-v2

      - name: Build OpenSSL for iOS (device arm64)
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: bash scripts/build-openssl.sh

      - name: Verify cached OpenSSL artifacts (rebuild locally if broken)
        if: steps.cache-openssl.outputs.cache-hit == 'true'
        run: |
          # 缓存可能存有半成品（job 在 save 前被 cancel / runner 磁盘满）：关键
          # 产物缺失时就地重建，否则报错点会漂移到 xcodebuild 链接期的
          # "library not found"，只能手动删 Actions 缓存才能恢复。
          if [ ! -s Vendor/openssl/lib/libcrypto-device.a ] || [ ! -f Vendor/openssl/include/openssl/crypto.h ]; then
            echo "::warning::OpenSSL 缓存不完整，已就地重建。注意：坏缓存键不会自愈（save 因 cache-hit=true 被跳过），若后续 run 反复出现，请到 Actions → Caches 删除 openssl-ios-* 缓存或 bump key 的 -v2 后缀"
            rm -rf Vendor/openssl
            bash scripts/build-openssl.sh
          fi

      - name: Save OpenSSL cache
        # 拆分 restore/save：actions/cache@v4 的 post-step 在 job 失败乃至被
        # cancel 时仍会保存（cancel-in-progress 下取消是常态），不完整产物会
        # 持久污染后续所有 run。save 仅在成功后执行。
        if: steps.cache-openssl.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            Vendor/openssl/lib
            Vendor/openssl/include
          key: openssl-ios-${{ runner.os }}-${{ hashFiles('scripts/build-openssl.sh') }}-v2

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build unsigned device IPA
        run: |
          MARKETING_VERSION="1.0.${{ github.run_number }}"
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Building v${MARKETING_VERSION} (${BUILD_NUMBER})"
          xcodebuild -project "IPA Manager.xcodeproj" \
            -scheme "IPA Manager" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            build
          mkdir -p build/artifacts
          # 标准 IPA 结构：必须 Payload/<App>.app/，否则 zsign 签名报
          # "Can't find payload directory"（ditto --keepParent 打包 .app 会把
          # .app 直接放压缩包根，生成结构非法的"IPA"，连自己都无法签名/安装）。
          # 这里先构造 Payload/<App>.app 再打包；用 zip 而非 ditto：ditto -c -k
          # 打包目录时不保留目录名本身（仍会丢掉 Payload 层），zip 打包目录
          # 会保留目录名，顶层恰好是 Payload/。
          mkdir -p build/staging/Payload
          cp -R "build/device/Build/Products/Release-iphoneos/IPA Manager.app" build/staging/Payload/
          cd build/staging
          zip -qr "../artifacts/IPA-Manager-v${MARKETING_VERSION}-unsigned.ipa" Payload

      - name: Verify IPA structure
        run: |
          IPA="build/artifacts/IPA-Manager-v1.0.${{ github.run_number }}-unsigned.ipa"
          # a) 产物存在且非空
          test -s "$IPA" || { echo "IPA 结构或版本校验失败，终止发布"; exit 1; }
          # b) 压缩包顶层第一项必须是 Payload/ 目录（历史上缺该层曾导致 zsign
          #    签名报 "Can't find payload directory"）
          FIRST_ENTRY="$(unzip -l "$IPA" | awk 'NR==4 {print $4}')"
          [ "$FIRST_ENTRY" = "Payload/" ] || { echo "IPA 结构或版本校验失败，终止发布"; exit 1; }
          # c) 必须存在 Payload/*.app/Info.plist
          unzip -Z1 "$IPA" | grep -qE '^Payload/[^/]+\.app/Info\.plist$' \
            || { echo "IPA 结构或版本校验失败，终止发布"; exit 1; }
          # d) 提取 Info.plist 校验版本号（plutil 对二进制 plist 输出
          #    "CFBundleShortVersionString" => "1.0.65" 格式）。
          #    只匹配 Payload/ 顶层 App 的 plist（^Payload/[^/]+.app/Info.plist），
          #    排除嵌套 .bundle/.appex 内的 Info.plist（其 CFBundleIdentifier 是
          #    资源包而非主 App，版本号可能不同导致误判）。
          PLIST_PATH="$(unzip -Z1 "$IPA" | grep -E '^Payload/[^/]+\.app/Info\.plist$' | head -1 || true)"
          test -n "$PLIST_PATH" || { echo "IPA 结构或版本校验失败，终止发布"; exit 1; }
          unzip -p "$IPA" "$PLIST_PATH" | plutil -p - > /tmp/ipa-info.txt
          grep -qE '"CFBundleShortVersionString" => "1\.0\.${{ github.run_number }}"' /tmp/ipa-info.txt \
            || { echo "IPA 结构或版本校验失败，终止发布"; exit 1; }
          grep -qE '"CFBundleVersion" => "${{ github.run_number }}"' /tmp/ipa-info.txt \
            || { echo "IPA 结构或版本校验失败，终止发布"; exit 1; }
          # e) 扩展必须随包：签名/打包环节剥离 PlugIns/*.appex 是"分享面板无扩展入口"
          #    的已知根因（iOS 不为缺失的扩展显示任何入口），产物侧先兜住
          APPEX_COUNT="$(unzip -Z1 "$IPA" | grep -oE '^Payload/[^/]+\.app/PlugIns/[^/]+\.appex/' | sort -u | wc -l | tr -d ' ')"
          [ "$APPEX_COUNT" -ge 2 ] || { echo "IPA 结构校验失败：PlugIns 扩展缺失（应含 2 个 appex，实际 $APPEX_COUNT）"; exit 1; }
          # f) 扩展 Info.plist 级校验：激活规则的文件计数 key 必须是【单数 File】
          #    （NSExtensionActivationSupportsFileWithMaxCount，Apple 文档原文）；
          #    复数 Files 不是有效 key，系统按未声明处理 → 文件载荷永远无法命中
          #    激活规则（分享入口出现却收不到文件）。bundle id 必须是主 App 子级。
          #    注：embedded.mobileprovision/_CodeSignature 由用户侧签名注入，未签名
          #    产物不含，无法在此校验——签名后的产物校验由 App 内"签名产物校验"
          #    （SigningEngine.verifyAppexProvisioning）与诊断报告的扩展章节覆盖。
          rm -rf /tmp/ipa-plist && mkdir -p /tmp/ipa-plist
          unzip -q "$IPA" 'Payload/*.app/PlugIns/*.appex/Info.plist' -d /tmp/ipa-plist
          APPEX_INFOS="$(find /tmp/ipa-plist -name 'Info.plist' | sort)"
          [ "$(echo "$APPEX_INFOS" | grep -c .)" -eq "$APPEX_COUNT" ] \
            || { echo "IPA 校验失败：扩展 Info.plist 数量（$(echo "$APPEX_INFOS" | grep -c .)）与 appex 数量（$APPEX_COUNT）不符"; exit 1; }
          # 注意：App 名带空格（IPA Manager.app），绝不能用 for-in 分词遍历，
          # 必须以 NUL 分隔逐条读取；FAIL 标记 + 主 shell 循环（进程替换）保证
          # 校验失败能真正终止流水线
          FAIL=0
          while IFS= read -r -d '' PLIST; do
            APPEX_NAME="$(basename "$(dirname "$PLIST")")"
            # 构建产物中的 Info.plist 可能已被 Xcode 转为二进制格式，先转 XML 再 grep
            plutil -convert xml1 -o /tmp/ext-info.plist "$PLIST" || { echo "IPA 校验失败：$APPEX_NAME Info.plist 无法解析"; FAIL=1; break; }
            if grep -q 'NSExtensionActivationSupportsFilesWithMaxCount' /tmp/ext-info.plist; then
              echo "IPA 校验失败：$APPEX_NAME 激活规则使用了无效的复数 Files key"; FAIL=1; break
            fi
            grep -q 'NSExtensionActivationSupportsFileWithMaxCount' /tmp/ext-info.plist \
              || { echo "IPA 校验失败：$APPEX_NAME 激活规则缺少单数 File key"; FAIL=1; break; }
            grep -q 'com\.ipamanager\.app' /tmp/ext-info.plist \
              || { echo "IPA 校验失败：$APPEX_NAME bundle id 不是主 App 子级"; FAIL=1; break; }
            echo "扩展 plist 校验通过：$APPEX_NAME（激活规则单数 File key + bundle id）"
          done < <(find /tmp/ipa-plist -name 'Info.plist' -print0)
          [ "$FAIL" -eq 0 ] || exit 1
          echo "IPA 校验通过：版本 1.0.${{ github.run_number }}（构建号 ${{ github.run_number }}），扩展 $APPEX_COUNT 个"
          # 产物完整性基准：人工发布流程（下载 artifact -> gh release create 上传）
          # 之间无可对照哈希时，无法发现 artifact 下载截断/损坏
          shasum -a 256 "$IPA" | tee build/artifacts/SHA256SUMS

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IPA-Manager-Build
          path: |
            build/artifacts
          if-no-files-found: error
          retention-days: 14