name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_15.2.app 2>/dev/null \
            || sudo xcode-select --switch /Applications/Xcode_15.1.app 2>/dev/null \
            || { echo "Required Xcode not found"; exit 1; }

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache OpenSSL build
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: |
            Vendor/openssl/lib
            Vendor/openssl/include
          key: openssl-ios-${{ runner.os }}-${{ hashFiles('scripts/build-openssl.sh') }}-v1

      - name: Build OpenSSL for iOS (device arm64)
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: bash scripts/build-openssl.sh

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build unsigned device IPA
        run: |
          MARKETING_VERSION="1.0.${{ github.run_number }}"
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Building v${MARKETING_VERSION} (${BUILD_NUMBER})"
          xcodebuild -project "IPA Manager.xcodeproj" \
            -scheme "IPA Manager" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            build
          mkdir -p build/artifacts
          # 标准 IPA 结构：必须 Payload/<App>.app/，否则 zsign 签名报
          # "Can't find payload directory"（ditto --keepParent 打包 .app 会把
          # .app 直接放压缩包根，生成结构非法的"IPA"，连自己都无法签名/安装）。
          # 这里先构造 Payload/<App>.app 再打包；用 zip 而非 ditto：ditto -c -k
          # 打包目录时不保留目录名本身（仍会丢掉 Payload 层），zip 打包目录
          # 会保留目录名，顶层恰好是 Payload/。
          mkdir -p build/staging/Payload
          cp -R "build/device/Build/Products/Release-iphoneos/IPA Manager.app" build/staging/Payload/
          cd build/staging
          zip -qr "../artifacts/IPA-Manager-v${MARKETING_VERSION}-unsigned.ipa" Payload

      - name: Verify IPA structure
        run: |
          IPA="build/artifacts/IPA-Manager-v1.0.${{ github.run_number }}-unsigned.ipa"
          # a) 产物存在且非空
          test -s "$IPA" || { echo "IPA 结构或版本校验失败，终止发布"; exit 1; }
          # b) 压缩包顶层第一项必须是 Payload/ 目录（历史上缺该层曾导致 zsign
          #    签名报 "Can't find payload directory"）
          FIRST_ENTRY="$(unzip -l "$IPA" | awk 'NR==4 {print $4}')"
          [ "$FIRST_ENTRY" = "Payload/" ] || { echo "IPA 结构或版本校验失败，终止发布"; exit 1; }
          # c) 必须存在 Payload/*.app/Info.plist
          unzip -Z1 "$IPA" | grep -qE '^Payload/[^/]+\.app/Info\.plist$' \
            || { echo "IPA 结构或版本校验失败，终止发布"; exit 1; }
          # d) 提取 Info.plist 校验版本号（plutil 对二进制 plist 输出
          #    "CFBundleShortVersionString" => "1.0.65" 格式）
          PLIST_PATH="$(unzip -Z1 "$IPA" | grep -m1 '\.app/Info\.plist$' || true)"
          test -n "$PLIST_PATH" || { echo "IPA 结构或版本校验失败，终止发布"; exit 1; }
          unzip -p "$IPA" "$PLIST_PATH" | plutil -p - > /tmp/ipa-info.txt
          grep -qE '"CFBundleShortVersionString" => "1\.0\.${{ github.run_number }}"' /tmp/ipa-info.txt \
            || { echo "IPA 结构或版本校验失败，终止发布"; exit 1; }
          grep -qE '"CFBundleVersion" => "${{ github.run_number }}"' /tmp/ipa-info.txt \
            || { echo "IPA 结构或版本校验失败，终止发布"; exit 1; }
          echo "IPA 校验通过：版本 1.0.${{ github.run_number }}（构建号 ${{ github.run_number }}）"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IPA-Manager-Build
          path: |
            build/artifacts
          if-no-files-found: error
          retention-days: 14