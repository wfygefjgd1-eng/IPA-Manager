name: IPA Manager
options:
  bundleIdPrefix: com.ipamanager
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    # 锁定精确版本：*.xcodeproj 不入库（gitignore），CI 每次 xcodegen generate
    # 都是全新解析——浮动版本（from:）会在上游发 0.x 小版本后静默换依赖，
    # 构建结果不可复现。升级走显式提交。
    exactVersion: "0.9.19"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  IPA Manager:
    type: application
    platform: iOS
    sources:
      - path: Sources
        # 分享扩展的源码属于扩展 target，主 App 不编译（避免 ShareViewController
        # 重复符号）；Sources/Shared（AppGroup 共享常量）两个 target 各编一份
        excludes:
          - ShareExtension/**
      - path: Vendor/zsign/src
        excludes:
          - zsign.cpp
          - third-party/zlib/adler32.c
          - third-party/zlib/compress.c
          - third-party/zlib/crc32.c
          - third-party/zlib/deflate.c
          - third-party/zlib/gzclose.c
          - third-party/zlib/gzlib.c
          - third-party/zlib/gzread.c
          - third-party/zlib/gzwrite.c
          - third-party/zlib/infback.c
          - third-party/zlib/inffast.c
          - third-party/zlib/inflate.c
          - third-party/zlib/inftrees.c
          - third-party/zlib/trees.c
          - third-party/zlib/uncompr.c
          - third-party/zlib/zutil.c
          - third-party/minizip/iowin32.c
          - third-party/minizip/iowin32.h
          - third-party/minizip/mztools.c
          - third-party/minizip/mztools.h
      - path: Vendor/zsign/ios
    dependencies:
      - package: ZIPFoundation
      # 分享扩展 + 动作扩展：嵌入 PlugIns/。分享面板里「IPA Manager」应用行入口
      # 与动作区入口（类似"QQ闪传分享"）都走同一接收逻辑：文件 → App Group 共享
      # 容器 → 主 App 回前台扫描 → 自动导入→签名→安装
      - target: "IPA Manager Share"
        embed: true
      - target: "IPA Manager Action"
        embed: true
    entitlements:
      path: IPAManager.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ipamanager.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipamanager.app
        INFOPLIST_FILE: Sources/Info.plist
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/zsign/src
          - $(SRCROOT)/Vendor/zsign/src/common
          - $(SRCROOT)/Vendor/zsign/src/third-party/zlib
          - $(SRCROOT)/Vendor/zsign/ios
          - $(SRCROOT)/Sources/Installer
          - $(SRCROOT)/Vendor/openssl/include
        USER_HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/zsign/ios
          - $(SRCROOT)/Sources/Installer
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        GCC_PREPROCESSOR_DEFINITIONS:
          - MINIZIP_FOPEN_NO_64=1
        OTHER_LDFLAGS:
          - $(SRCROOT)/Vendor/openssl/lib/libcrypto-device.a
          - -lz
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Sources/Bridging-Header.h
        ENABLE_MODULES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: IPA Manager
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIFileSharingEnabled: true
        # 分享导入可靠性（v1.0.121）：关闭 in-place 后，所有「拷贝到 / 打开方式」投递
        # 一律由系统先把文件拷入 Documents/Inbox 再投递 openURL——回前台 Inbox 兜底扫描
        # （AppState.processInboxFilesIfNeeded）才能在 open 事件丢失时补处理。若开启
        # in-place，投递可能直接给出来源 App 沙盒内的原位 URL（文件不落地），事件一旦
        # 丢失无任何兜底手段。本 App 对外部文件只做导入复制、从不原位编辑，in-place
        # 无实际收益。
        LSSupportsOpeningDocumentsInPlace: false
        # 分享路由修正（v1.0.122）：UISupportsDocumentBrowser 声明本 App 为"文档浏览器"
        # 应用，与 UIFileSharingEnabled（文件共享）是 Apple 定位中两种互斥的文件暴露
        # 模式，组合声明矛盾。实测 iOS 27 分享面板出现"无载荷入口"（直接分享到、点开
        # App 却不拷贝文件——分享后毫无反应）的头号嫌疑即此：系统按文档浏览器语义路由
        # 分享而不走拷贝投递。本 App 从不使用 UIDocumentBrowserViewController，
        # Documents 在文件 App 的可见性由 UIFileSharingEnabled 单独提供，关闭此 key。
        UISupportsDocumentBrowser: false
        # ATS（P0-5 安全加固）：移除 NSAllowsArbitraryLoads 全局放行，改为精细化控制
        # - NSAllowsArbitraryLoads: false  默认禁止明文 HTTP
        # - NSAllowsLocalNetworking: true  允许本地回环/局域网明文（127.0.0.1 安装服务器自检、局域网 manifest/ipa）
        # - NSExceptionDomains: 仅对 api.palera.in 放行例外（公网 manifest 生成，需 NSIncludesSubdomains）
        #   其余 IPA 下载站若为 http，用户需通过 https 镜像或自行添加例外；浏览器仍可访问 https 站点。
        #   如需兼容大量 http 下载站，可临时改回 NSAllowsArbitraryLoads: true，但需文档注明风险。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            api.palera.in:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: false
              NSExceptionRequiresForwardSecrecy: false
              NSExceptionMinimumTLSVersion: TLSv1.2
        # iOS 14+ 本地网络隐私：itms-services 用设备局域网 IP（192.168.x.x）下载
        # manifest/ipa 时，SpringBoard 需访问本地网络。声明用途并允许明文 HTTP。
        NSLocalNetworkUsageDescription: 安装 IPA 时需要通过本地网络将签名后的应用传送到系统安装器
        # itms-services 打开后 App 立即退到后台，本地 HTTP 服务器（NWListener）必须继续
        # 接受 manifest/ipa 下载连接：用 audio 后台模式 + 静音音频保活（iOS 无 "network"
        # 后台模式值，network 会被忽略），退后台后进程不挂起、NWListener 持续接收连接。
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: ""
        # 分享面板「拷贝到 IPA Manager」链路：文档类型声明是对文件类分享的官方集成，
        # 声明后 App 以「拷贝到 IPA Manager」出现在分享面板 App 行，系统把文件拷入
        # Documents/Inbox 并投递 openURL。public.data 是兜底（任意未知扩展名的文件
        # 动态 UTI 均 conforms 到它）；显式列出 com.ipamanager.ipa（下方 imported
        # declaration）与 public.zip-archive 提升微信/QQ/Safari/文件等来源的匹配率。
        CFBundleDocumentTypes:
          - CFBundleTypeName: IPA File
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.ipamanager.ipa
              - public.zip-archive
              - public.data
            CFBundleTypeRole: Viewer
        # 自定义 scheme：分享扩展保存文件后尝试 ipamanager://import 拉起主 App
        #（历史系统版本对分享扩展不支持 open，失败无副作用；主 App 收到后直接
        # 触发共享收件箱扫描）
        CFBundleURLTypes:
          - CFBundleURLName: com.ipamanager.app
            CFBundleURLSchemes:
              - ipamanager
        # .ipa 在 iOS 无系统 UTI，不声明时系统按动态 UTI（仅 conforms public.data）
        # 匹配；显式声明后按扩展名精确映射，分享面板/打开方式的匹配更可靠。
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.ipamanager.ipa
            UTTypeDescription: iOS 应用安装包 (IPA)
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
  IPA Manager Share:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ShareExtension
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipamanager.app.Share
        INFOPLIST_FILE: Sources/ShareExtension/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: IPA Manager
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          # 字典 v2 激活规则：任何本地文件类分享（ipa/zip/p12/…）都出现本入口
          NSExtensionActivationRule:
            NSExtensionActivationDictionaryVersion: 2
            NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: Sources/ShareExtension/IPAManagerShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ipamanager.app
  IPA Manager Action:
    # 动作扩展（com.apple.ui-services）：出现在分享面板动作区（与"QQ闪传分享"同级），
    # 点按不跳转主 App，原地弹出接收面板；与分享扩展共用同一接收控制器与共享容器
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ShareExtension
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipamanager.app.Action
        INFOPLIST_FILE: Sources/ShareExtension/ActionInfo.plist
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/ShareExtension/ActionInfo.plist
      properties:
        CFBundleDisplayName: IPA Manager
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionActivationRule:
            NSExtensionActivationDictionaryVersion: 2
            NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: Sources/ShareExtension/IPAManagerAction.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ipamanager.app
schemes:
  IPA Manager:
    build:
      targets:
        IPA Manager: all
    run:
      config: Debug
    archive:
      config: Release
  IPA Manager Share:
    build:
      targets:
        IPA Manager Share: all
