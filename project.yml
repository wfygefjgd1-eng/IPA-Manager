name: IPA Manager
options:
  bundleIdPrefix: com.ipamanager
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.19"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  IPA Manager:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Vendor/zsign/src
        excludes:
          - zsign.cpp
          - third-party/zlib/adler32.c
          - third-party/zlib/compress.c
          - third-party/zlib/crc32.c
          - third-party/zlib/deflate.c
          - third-party/zlib/gzclose.c
          - third-party/zlib/gzlib.c
          - third-party/zlib/gzread.c
          - third-party/zlib/gzwrite.c
          - third-party/zlib/infback.c
          - third-party/zlib/inffast.c
          - third-party/zlib/inflate.c
          - third-party/zlib/inftrees.c
          - third-party/zlib/trees.c
          - third-party/zlib/uncompr.c
          - third-party/zlib/zutil.c
          - third-party/minizip/iowin32.c
          - third-party/minizip/iowin32.h
          - third-party/minizip/mztools.c
          - third-party/minizip/mztools.h
      - path: Vendor/zsign/ios
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipamanager.app
        INFOPLIST_FILE: Sources/Info.plist
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/zsign/src
          - $(SRCROOT)/Vendor/zsign/src/common
          - $(SRCROOT)/Vendor/zsign/src/third-party/zlib
          - $(SRCROOT)/Vendor/zsign/ios
          - $(SRCROOT)/Sources/Installer
          - $(SRCROOT)/Vendor/openssl/include
        USER_HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/zsign/ios
          - $(SRCROOT)/Sources/Installer
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        GCC_PREPROCESSOR_DEFINITIONS:
          - MINIZIP_FOPEN_NO_64=1
        OTHER_LDFLAGS:
          - $(SRCROOT)/Vendor/openssl/lib/libcrypto-device.a
          - $(SRCROOT)/Vendor/openssl/lib/libssl-device.a
          - -lz
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Sources/Bridging-Header.h
        ENABLE_MODULES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: IPA Manager
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: true
        # ATS：安装链路 manifest 已走公网 HTTPS（api.palera.in），App 自身本地服务器
        # 自检（127.0.0.1）依赖明文 HTTP；内置浏览器需访问 http:// 下载站
        # （大量 IPA 站点仍为明文 http）。权衡功能可用性后保留 NSAllowsArbitraryLoads
        # 并配合 NSAllowsLocalNetworking（后者保证本地回环/局域网明文）。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        # iOS 14+ 本地网络隐私：itms-services 用设备局域网 IP（192.168.x.x）下载
        # manifest/ipa 时，SpringBoard 需访问本地网络。声明用途并允许明文 HTTP。
        NSLocalNetworkUsageDescription: 安装 IPA 时需要通过本地网络将签名后的应用传送到系统安装器
        # itms-services 打开后 App 立即退到后台，本地 HTTP 服务器（NWListener）必须继续
        # 接受 manifest/ipa 下载连接：用 audio 后台模式 + 静音音频保活（iOS 无 "network"
        # 后台模式值，network 会被忽略），退后台后进程不挂起、NWListener 持续接收连接。
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: IPA File
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.data
            CFBundleTypeRole: Viewer
schemes:
  IPA Manager:
    build:
      targets:
        IPA Manager: all
    run:
      config: Debug
    archive:
      config: Release
