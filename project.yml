name: IPA Manager
options:
  bundleIdPrefix: com.ipamanager
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    # 锁定精确版本：*.xcodeproj 不入库（gitignore），CI 每次 xcodegen generate
    # 都是全新解析——浮动版本（from:）会在上游发 0.x 小版本后静默换依赖，
    # 构建结果不可复现。升级走显式提交。
    exactVersion: "0.9.19"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  IPA Manager:
    type: application
    platform: iOS
    sources:
      - path: Sources
        # 分享扩展的源码属于扩展 target，主 App 不编译（避免 ShareViewController
        # 重复符号）；Sources/Shared（AppGroup 共享常量）两个 target 各编一份
        excludes:
          - ShareExtension/**
      - path: Vendor/zsign/src
        excludes:
          - zsign.cpp
          - third-party/zlib/adler32.c
          - third-party/zlib/compress.c
          - third-party/zlib/crc32.c
          - third-party/zlib/deflate.c
          - third-party/zlib/gzclose.c
          - third-party/zlib/gzlib.c
          - third-party/zlib/gzread.c
          - third-party/zlib/gzwrite.c
          - third-party/zlib/infback.c
          - third-party/zlib/inffast.c
          - third-party/zlib/inflate.c
          - third-party/zlib/inftrees.c
          - third-party/zlib/trees.c
          - third-party/zlib/uncompr.c
          - third-party/zlib/zutil.c
          - third-party/minizip/iowin32.c
          - third-party/minizip/iowin32.h
          - third-party/minizip/mztools.c
          - third-party/minizip/mztools.h
      - path: Vendor/zsign/ios
    dependencies:
      - package: ZIPFoundation
      # 分享扩展 + 动作扩展：嵌入 PlugIns/。分享面板里「IPA Manager」应用行入口
      # 与动作区入口（类似"QQ闪传分享"）都走同一接收逻辑：文件 → App Group 共享
      # 容器 → 主 App 回前台扫描 → 自动导入→签名→安装
      - target: "IPA Manager Share"
        embed: true
      - target: "IPA Manager Action"
        embed: true
    entitlements:
      path: IPAManager.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ipamanager.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipamanager.app
        # Info.plist 路径由下方 info: 节统一声明（xcodegen 会设置 INFOPLIST_FILE），
        # settings 里不再重复声明：双处声明一旦只改其一，properties 生成路径与工程
        # 实际引用路径会静默断连且无告警
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/zsign/src
          - $(SRCROOT)/Vendor/zsign/src/common
          - $(SRCROOT)/Vendor/zsign/src/third-party/zlib
          - $(SRCROOT)/Vendor/zsign/ios
          - $(SRCROOT)/Sources/Installer
          - $(SRCROOT)/Vendor/openssl/include
        USER_HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/zsign/ios
          - $(SRCROOT)/Sources/Installer
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        GCC_PREPROCESSOR_DEFINITIONS:
          - MINIZIP_FOPEN_NO_64=1
        OTHER_LDFLAGS:
          - $(SRCROOT)/Vendor/openssl/lib/libcrypto-device.a
          - -lz
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Sources/Bridging-Header.h
        ENABLE_MODULES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: IPA Manager
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIFileSharingEnabled: true
        # 分享导入可靠性（v1.0.121）：关闭 in-place 后，所有「拷贝到 / 打开方式」投递
        # 一律由系统先把文件拷入 Documents/Inbox 再投递 openURL——回前台 Inbox 兜底扫描
        # （AppState.processInboxFilesIfNeeded）才能在 open 事件丢失时补处理。若开启
        # in-place（YES），投递可能直接给出来源 App 沙盒内的原位 URL（文件不落地），事件一旦
        # 丢失无任何兜底手段，且原位 URL 需要全程持有安全作用域、本 App 又只做导入复制、
        # 从不原位编辑，in-place 无实际收益——必须保持 false，不可改为 YES。
        LSSupportsOpeningDocumentsInPlace: false
        # 分享路由修正（v1.0.122）：UISupportsDocumentBrowser 声明本 App 为"文档浏览器"
        # 应用，与 UIFileSharingEnabled（文件共享）是 Apple 定位中两种互斥的文件暴露
        # 模式，组合声明矛盾。实测 iOS 27 分享面板出现"无载荷入口"（直接分享到、点开
        # App 却不拷贝文件——分享后毫无反应）的头号嫌疑即此：系统按文档浏览器语义路由
        # 分享而不走拷贝投递。本 App 从不使用 UIDocumentBrowserViewController，
        # Documents 在文件 App 的可见性由 UIFileSharingEnabled 单独提供，关闭此 key。
        UISupportsDocumentBrowser: false
        # ATS（P0-5 安全加固）：移除 NSAllowsArbitraryLoads 全局放行，改为精细化控制
        # - NSAllowsArbitraryLoads: false  默认禁止明文 HTTP
        # - NSAllowsLocalNetworking: true  允许本地回环/局域网明文（127.0.0.1 安装服务器自检、局域网 manifest/ipa）
        # - NSExceptionDomains: 仅对 api.palera.in 放行例外（公网 manifest 生成，需 NSIncludesSubdomains）
        #   其余 IPA 下载站若为 http，用户需通过 https 镜像或自行添加例外；浏览器仍可访问 https 站点。
        #   如需兼容大量 http 下载站，可临时改回 NSAllowsArbitraryLoads: true，但需文档注明风险。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            api.palera.in:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: false
              NSExceptionRequiresForwardSecrecy: false
              NSExceptionMinimumTLSVersion: TLSv1.2
        # iOS 14+ 本地网络隐私：itms-services 用设备局域网 IP（192.168.x.x）下载
        # manifest/ipa 时，SpringBoard 需访问本地网络。声明用途并允许明文 HTTP。
        NSLocalNetworkUsageDescription: 安装 IPA 时需要通过本地网络将签名后的应用传送到系统安装器
        # itms-services 打开后 App 立即退到后台，本地 HTTP 服务器（NWListener）必须继续
        # 接受 manifest/ipa 下载连接：用 audio 后台模式 + 静音音频保活（iOS 无 "network"
        # 后台模式值，network 会被忽略），退后台后进程不挂起、NWListener 持续接收连接。
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: ""
        # 分享面板「拷贝到 IPA Manager」链路：文档类型声明是对文件类分享的官方集成，
        # 声明后 App 以「拷贝到 IPA Manager」出现在分享面板 App 行，系统把文件拷入
        # Documents/Inbox 并投递 openURL。public.data 是兜底（任意未知扩展名的文件
        # 动态 UTI 均 conforms 到它）；显式列出 com.ipamanager.ipa（下方 imported
        # declaration）与 com.apple.itunes.ipa（系统侧对 .ipa 的通用标识，微信/QQ/
        # Safari/文件等来源按此标记时命中）及 public.zip-archive / com.pkware.zip-archive /
        # public.archive（zip 各别名，覆盖不同来源的 UTI 标记差异），提升匹配率。
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.apple.itunes.ipa
              - com.ipamanager.ipa
              - public.zip-archive
              - com.pkware.zip-archive
              - public.archive
              - public.data
        # 自定义 scheme：分享扩展保存文件后尝试 ipamanager://import 拉起主 App
        #（历史系统版本对分享扩展不支持 open，失败无副作用；主 App 收到后直接
        # 触发共享收件箱扫描）
        CFBundleURLTypes:
          - CFBundleURLName: com.ipamanager.app
            CFBundleURLSchemes:
              - ipamanager
        # .ipa 在 iOS 无系统 UTI，不声明时系统按动态 UTI（仅 conforms public.data）
        # 匹配；显式声明后按扩展名精确映射，分享面板/打开方式的匹配更可靠。
        # com.apple.itunes.ipa 为系统侧对 .ipa 的通用标识（conforms public.zip-archive，
        # 本体即 zip，文件 App/微信/QQ/Safari 按此标记时命中）；com.ipamanager.ipa
        # 为本 App 自定义标识（历史兼容，conforms public.archive）。两者同映射 .ipa
        # 后缀并存，可最大化各来源 App 的 UTI 匹配率。
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.itunes.ipa
            UTTypeDescription: iOS App Package
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
          - UTTypeIdentifier: com.ipamanager.ipa
            UTTypeDescription: iOS 应用安装包 (IPA)
            UTTypeConformsTo:
              - public.data
              - public.archive
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
  IPA Manager Share:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ShareExtension
        # 两个扩展共用本目录：排除对方 target 的 entitlements / Info.plist 生成物，
        # 避免被当资源拷进本扩展的 appex（Info.plist 类文件 xcodegen 不进编译阶段，
        # 但改名后的 ActionInfo.plist 与 *.entitlements 无此保证）
        excludes:
          - ActionInfo.plist
          - "*.entitlements"
      - path: Sources/Shared
      # 导入任务模型与存储：扩展负责在 App Group 内创建任务 JSON
      - path: Sources/ImportPipeline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipamanager.app.Share
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/ShareExtension/Info.plist
      properties:
        # 显示名与主 App 区分开：分享面板里"IPA Manager 分享"= 本扩展面板入口
        #（点它应弹出接收面板），便于与应用行/文档投递入口区分排查
        CFBundleDisplayName: IPA Manager 分享
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          # 激活规则必须用字典谓词：TRUEPREDICATE 是编译期占位布尔，iOS 17+ 对它
          # 的运行时行为未定义——实测（iOS 27）分享面板显示入口但点按不呈现扩展
          # UI（表现为"跳到主 App 后毫无反应"）。字典规则声明接受文件类载荷
          #（ipa/zip/证书），QQ/微信传文件给的是 file 附件，能正常命中；
          # 纯文本/网页分享不再显示入口（本就处理不了），误触率为零。
          # 键名必须是系统标准单数 File：复数 Files 不是有效键，系统按未声明处理，
          # 文件类载荷无法命中激活规则（分享入口出现却收不到文件载荷）。
          NSExtensionActivationRule:
            NSExtensionActivationDictionaryVersion: 2
            NSExtensionActivationSupportsFileWithMaxCount: 20
            NSExtensionActivationSupportsAttachmentsWithMaxCount: 20
    entitlements:
      path: Sources/ShareExtension/IPAManagerShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ipamanager.app
  IPA Manager Action:
    # 动作扩展（com.apple.ui-services）：出现在分享面板动作区（与"QQ闪传分享"同级），
    # 点按不跳转主 App，原地弹出接收面板；与分享扩展共用同一接收控制器与共享容器
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ShareExtension
        # 与分享扩展共用接收控制器目录；该目录内的 Info.plist / ActionInfo.plist
        # 属于 Share target，*.entitlements 是两个扩展的签名配置，均须排除，
        # 避免被当资源拷进本 target 的 appex
        excludes:
          - Info.plist
          - ActionInfo.plist
          - "*.entitlements"
      - path: Sources/Shared
      # 导入任务模型与存储：动作扩展与分享扩展共用同一接收逻辑
      - path: Sources/ImportPipeline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipamanager.app.Action
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/ShareExtension/ActionInfo.plist
      properties:
        # 显示名带"接收"字样：动作列表里可辨识（旧名"IPA Manager・接收"的
        # ・字符在部分列表里显示易混，统一为空格分隔）
        CFBundleDisplayName: IPA Manager 接收
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          # 与分享扩展同理：字典谓词（TRUEPREDICATE 在 iOS 17+ 行为未定义），
          # 接受文件类载荷，不支持的类型由扩展内明确提示
          NSExtensionActivationRule:
            NSExtensionActivationDictionaryVersion: 2
            NSExtensionActivationSupportsFileWithMaxCount: 20
            NSExtensionActivationSupportsAttachmentsWithMaxCount: 20
    entitlements:
      path: Sources/ShareExtension/IPAManagerAction.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ipamanager.app
schemes:
  IPA Manager:
    build:
      targets:
        IPA Manager: all
    run:
      config: Debug
    archive:
      config: Release
  IPA Manager Share:
    build:
      targets:
        IPA Manager Share: all
